<section aria-labelledby="modal-heading">
    <h3 id="modal-heading">Dialog Example</h3>
    <button type="button" onclick="document.getElementById('confirmation-dialog').showModal()">Open Confirmation Dialog</button>
    
    <dialog id="confirmation-dialog" aria-labelledby="dialog-title" aria-describedby="dialog-desc">
        <h2 id="dialog-title">Confirm Action</h2>
        <p id="dialog-desc">Are you sure you want to proceed with this destructive action? This cannot be undone.</p>
        <form method="dialog">
            <button type="button" onclick="document.getElementById('confirmation-dialog').close('cancel')">Cancel</button>
            <button type="submit" value="confirm">Confirm</button>
        </form>
    </dialog>
</section>
